ate its effect even when 1) Only you or the opponent controls any Spirit/Ultimate; 2) Neither player controls any Spirit/Ultimate\\n","\\n","----------\\n","\\n","Each effect cannot be interrupted by another effect while resolving (with several exceptions)\\n","\\n","If there are not enough, or no targets available for an effect, the effect is still treated as being activated, and will be resolved as much as possible.\\n","\\n","EXAMPLE\\n","If the opponent only has one target available, Thorn Prison (RV) will exhaust that target.\\n","\\n","Flame Tempest (RV) will activate its effect even when all potential targets are immune.\\n","\\n","The ShiningSacredSword Shining-Sword X will trigger [Burst: After an opposing Spirit/Brave\'s (When Summoned) effect resolves] even it has zero targets to destroy. This phenomenon is referred as \\"空打ち\\" in Japanese (or figuratively, \\"fizzle\\" in English).\\n","\\n","Legend Gundam can return zero targets via its effect. This is due to the wording \\"up to,\\" (まで) and 0 is included within the range.\\n","\\n","----------\\n","\\n","There are exceptions to this rule (e.g. \\"By\\" effects), which will be explained in its own section.\\n","\\n"],"B":[1233],"C":[{"C":"YADLjI9qxTA,0","G":"16px","K":"italic","M":"#dba81b"},{"I":"bold","O":"underline"},{"J":true,"M":"#dbcea0","P":true},{"L":true},{"e":"disc","g":"1","k":"1.7em"},{"f":true,"h":true,"l":true},{"G":"13.3334px","M":"#d9d9d9","O":"underline"},{"P":true},{"I":"bold","O":"underline","Q":"https://battle-spirits.fandom.com/wiki/Deadly_Balance#Revival_","e":"disc","g":"1","k":"1.7em"},{"J":true,"P":true,"R":true},{"M":"#dbcea0"},{"G":"16px","f":true,"h":true,"l":true},{"e":"disc","g":"1","k":"1.7em"},{"M":"#d9d9d9","f":true,"h":true,"l":true},{"M":"#dbcea0","e":"disc","g":"1","k":"1.7em"},{"M":"#ffbd59"},{"M":"#dbcea0"},{"M":"#ffbd59"},{"M":"#dbcea0"},{"M":"#ffbd59"},{"M":"#dbcea0"},{"f":true,"h":true,"l":true},{"G":"13.3334px","M":"#d9d9d9","O":"underline"},{"P":true},{"I":"b n effect without specified timing, is activated before (When Summoned) effect, hence able to defend BoneShark)\\n","\\n","----------\\n","\\n","Otherwise, the activating order of the effects will be decided by the turn player\\n","\\n","EXAMPLE\\n","When multiple Spirits with (When Destroyed) effect are destroyed by The AbsoluteDragonDeity Amaterasu-Dragon, the turn player decides the activation order of all (When Destroyed) effects.\\n","\\n","==========\\n","\\n","EXCEPTIONS\\n","\\n","When two or more rule-overriding effects contradicts, instead of Turn Player\'s Order, only the effect that comes last activates\\n","\\n","EXAMPLE\\n","The trash-lock effect of the Forest of the Giant Faced Stones overrides the trash-protection effect of Anubis\' Underworld Temple when Giant Faced Stones is deployed later than Anubis\' Temple. \\n","\\n","----------\\n","\\n","When both players have effects triggered from their hand in the same timing:\\n","\\n","The non-turn player declares all triggers from their hand. Then the turn player declares all triggers from their hand.\\n","After all triggers are declared, the turn player decides the activation order (including other effects that activate from the field/trash.\\n","\\n","EXAMPLE\\n","When both players\' Arche Gundam would trigger at the same time, both players declare the use of Arche Gundam (in the order of opposing player, then turn player), before the turn player decides the activation order.\\n","\\n"],"B":[1724],"C":[{"C":"YADLjI9qxTA,0","G":"16px","M":"#dbcea0"},{"K":"italic","M":"#ff1616"},{"L":true,"M":"#dbcea0"},{"K":"italic","M":"#ff1616"},{"L":true,"M":"#dbcea0","e":"disc","g":"1","k":"1.7em"},{"G":"14.6667px","f":true,"h":true,"l":true},{"G":"13.3334px","M":"#d9d9d9","O":"underline"},{"P":true},{"I":"bold","O":"underline","Q":"https://battle-spirits.fandom.com/wiki/Dark-Gadphant","e":"disc","g":"1","k":"1.7em"},{"J":true,"P":true,"R":true},{"I":"bold","K":"italic","M":"#ff1616"},{"J":true,"L":true,"M":"#d9d9d erform [A].\\n","\\n","This type of effect overrides mandatory and optional effects.\\n","\\n","EXAMPLE\\n","The AbyssalTwinDragon Hasturk overrides force-blocking effects (e.g. Clash)\\n","\\n","While The TwinkleStarDragon Chondrite Dragon is present, if the opponent summons a Spirit with a mandatory (When Summoned) effect, the opponent can choose not to activate that effect, thus not having to take a life damage.\\n","\\n","However, if [A] is an action attached to a card, as long as the card processing [A] carries immunity against this kind of effect, the owner of the card does NOT have to perform [B] to process [A].\\n","\\n","EXAMPLE\\n","While The TwinkleStarDragon Chondrite Dragon is present, if the opponent summons a Spirit with a (When Summoned) effect, and that Spirit has Armor: Red, the opponent does NOT have to take a life damage to activate the (When Summoned) effect.\\n","\\n","While your New Generation Ultraman Reiga is attacking at Lv2, the opponent can use Silent Wall LT from hand WITHOUT taking a life damage.\\n","\\n","Meanwhile, Buffalong-Bill would still require opposing Cost 6 or more Spirits to target attack itself, even if those Spirits have Armor: White, as “declaring an attack“ is a player action NOT attached to the Spirits with Armor: White, hence the “attack declaration“ CANNOT avoid Buffalong-Bill‘s effect with Armor: White.\\n","\\n","==========\\n","\\n","Immunity effects can prevent most of those effects. However, there are special cases if the effect targets BOTH the field and the player.\\n","\\n","EXAMPLE\\n","While The Bal-Masque Grand Duke Saegebracht -Holy Devil Form- is present, Spirits with Heavy Armor: Purple or immunity will not be able to attack or block at all.\\n","\\n","(EXPLANATION: Saegebracht\'s effect targets BOTH the Spirits and the player. While the Spirits with immunity does prevent from the potential core removal effect, the PLAYER themself still needs to remove a core in order to attack or block.\\n","\\n","As a
