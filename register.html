<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="referrer" content="no-referrer"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Duelist Registration | Battle Spirits Eternal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=5.0">
</head>
<body>

<!-- ╔══════════════════ NAVBAR ══════════════════╗ -->
<header class="navbar">
  <a class="brand" href="./index.html">
    <span class="brand-icon">⚔️</span>
    <span class="brand-title">Battle Spirits Eternal</span>
  </a>
  <nav class="nav-tabs">
    <a class="tab-btn tab-btn-battle" id="tabBattle" href="./arena.html">⚔️ Battle Arena</a>
    <a class="tab-btn" id="tabBrowse" href="./browse.html">🎴 Browse Cards</a>
    <a class="tab-btn" id="tabFamily" href="./family.html">📖 Family</a>
    <a class="tab-btn" id="tabSets" href="./sets.html">📦 Card Sets</a>
    <a class="tab-btn" id="tabDeck" href="./deck.html">🃏 Deck Builder <span class="deck-badge" id="deckBadge">0</span></a>
    <div class="nav-auth-slot" id="navAuthSlot">
      <a class="tab-btn tab-btn-auth active" id="tabAuth" href="./login.html">👤 Login</a>
    </div>
  </nav>
</header>

<main class="main">
  <div class="auth-page-wrapper">
    
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge">✨ New Registration</div>
        <h1 class="auth-title">Register Duelist</h1>
        <p class="auth-subtitle">Create your personal Battle Spirits identity to craft and save multiple custom decks.</p>
      </div>

      <div id="authAlert" class="auth-alert"></div>

      <form class="auth-form" id="registerForm" onsubmit="handleRegisterSubmit(event)">
        <!-- Field 1: Duelist Display Username -->
        <div class="auth-field">
          <label class="auth-label" for="regUsername">
            <span>👑</span> Duelist Username
          </label>
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">👑</span>
            <input type="text" id="regUsername" class="auth-input" placeholder="e.g. Dan Bashin" required autofocus autocomplete="nickname">
          </div>
        </div>

        <!-- Field 2: Email -->
        <div class="auth-field">
          <label class="auth-label" for="regEmail">
            <span>✉️</span> Email Address
          </label>
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">✉️</span>
            <input type="email" id="regEmail" class="auth-input" placeholder="duelist@example.com" required autocomplete="email">
          </div>
        </div>

        <!-- Field 3: Password -->
        <div class="auth-field">
          <label class="auth-label" for="regPassword">
            <span>🔒</span> Password (min 6 characters)
          </label>
          <div class="auth-input-wrapper">
            <span class="auth-input-icon">🔒</span>
            <input type="password" id="regPassword" class="auth-input" placeholder="Create a strong password..." minlength="6" required autocomplete="new-password">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-btn-primary" id="btnRegisterSubmit">
          <span>✨ Create Duelist Account</span>
        </button>
      </form>
    </div>

    <!-- Below Card: Return to Login -->
    <div class="auth-switch-card">
      <span>Already have a Duelist Account?</span>
      <a class="auth-switch-link" href="./login.html">Sign In Here →</a>
    </div>

  </div>
</main>

<!-- Firebase Client SDK (Compat CDN for GitHub Pages) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js"></script>
<script src="./firebase_service.js?v=1.1"></script>
<script src="./app.js?v=4.7"></script>

<script>
function showAlert(message, type = 'error') {
  const alertEl = document.getElementById('authAlert');
  if (!alertEl) return;
  alertEl.className = 'auth-alert ' + type;
  alertEl.innerHTML = (type === 'error' ? '⚠️ ' : '✅ ') + message;
  alertEl.style.display = 'flex';
}

function clearAlert() {
  const alertEl = document.getElementById('authAlert');
  if (alertEl) alertEl.style.display = 'none';
}

async function handleRegisterSubmit(event) {
  event.preventDefault();
  clearAlert();

  const username = document.getElementById('regUsername').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const btn = document.getElementById('btnRegisterSubmit');

  if (!username || !email || !password) {
    showAlert('Please fill in all registration fields.');
    return;
  }
  if (password.length < 6) {
    showAlert('Password must be at least 6 characters.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span>⏳ Creating Account...</span>';

  try {
    if (window.FirebaseService) {
      await window.FirebaseService.register(email, password, username);
      const duelistId = window.FirebaseService.getFormattedDuelistId();
      showAlert(`🎉 Account created! Welcome, Duelist ${username} (ID: #${duelistId})`, 'success');
      setTimeout(() => {
        window.location.href = './arena.html';
      }, 800);
    } else {
      throw new Error('Firebase Authentication is initializing.');
    }
  } catch (err) {
    console.error('Registration error:', err);
    showAlert(err.message || 'Failed to create account. Please verify your details.');
    btn.disabled = false;
    btn.innerHTML = '<span>✨ Create Duelist Account</span>';
  }
}
</script>
</body>
</html>
